[package]
name = "yaserde"
version = "0.12.0"
authors = ["Marc-Antoine Arnaud <arnaud.marcantoine@gmail.com>"]
description = "Serialization and deserialization library"
keywords = ["Serialization", "Deserialization", "XML"]
license = "MIT"
repository = "https://github.com/media-io/yaserde"
homepage = "https://github.com/media-io/yaserde"
documentation = "https://docs.rs/yaserde"
readme = "../README.md"
edition = "2018"

[features]
default = ["xml-rs-backend"]
derive = ["yaserde_derive"]
xml-rs-backend = []
quick-xml-backend = ["quick-xml"]

[dependencies]
yaserde_derive = { version = "0.12.0", path = "../yaserde_derive", optional = true }
xml-rs = "0.8.3"
quick-xml = { version = "0.39", optional = true }
log = "0.4"

[dev-dependencies]
env_logger = "0.11.0"
yaserde_derive = { version = "0.12.0", path = "../yaserde_derive" }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_deserialize"
harness = false
required-features = ["quick-xml-backend"]

[[bench]]
name = "bench_serialize"
harness = false
required-features = ["quick-xml-backend"]

[badges]
travis-ci = { repository = "media-io/yaserde" }
